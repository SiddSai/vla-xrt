[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-xrt"
version = "0.1.0"
description = "Cross-modal instruction-scene red teaming protocol for VLA policies"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
vla-xrt = "vla_xrt.cli:main"

[project.optional-dependencies]
instruction-generation = ["openai>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
